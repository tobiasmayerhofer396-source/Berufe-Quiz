<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berufe-Quiz</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>🎯 Berufe-Quiz</h1>
</header>

<main>

<section id="startScreen">

    <h2>Willkommen</h2>

    <p>
        Finde heraus, welcher Beruf zu dir passt.
    </p>

    <button id="startButton">
        Quiz starten
    </button>

</section>


<section id="quizScreen" class="hidden">

    <h2 id="question">
        Frage
    </h2>

    <div id="answers">

    </div>

</section>


<section id="resultScreen" class="hidden">

    <h2>Ergebnis</h2>

    <div id="result">

    </div>

</section>

</main>

<script src="js/quiz.js"></script>
<script src="js/app.js"></script>

</body>
</html>
